{% extends 'base.html' %}
{% load static %}

{% block extra_head %}
<!-- Prism.js for Markdown Code Syntax Highlighting -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
<style>
    /* Learning Module Specific Styles */
    .learning-header {
        margin-bottom: 2rem;
        padding-bottom: 1rem;
        border-bottom: 1px solid var(--border-color);
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 1rem;
    }

    .learning-search {
        display: flex;
        gap: 0.5rem;
        width: 100%;
        max-width: 400px;
    }

    .learning-search input {
        flex: 1;
        border-radius: 8px;
    }

    .learning-search button {
        padding: 0.5rem 1rem;
        border-radius: 8px;
    }

    /* Layout: Sidebar + Main Content */
    .learning-container {
        display: flex;
        gap: 2rem;
        align-items: flex-start;
    }

    .learning-sidebar {
        width: 280px;
        flex-shrink: 0;
        position: sticky;
        top: 2rem;
        max-height: calc(100vh - 4rem);
        overflow-y: auto;
    }

    .learning-content {
        flex: 1;
        min-width: 0; 
        background: var(--bg-card);
        padding: 2.5rem;
        border-radius: 16px;
        box-shadow: var(--shadow-sm);
        border: 1px solid var(--border-color);
    }

    @media (max-width: 1024px) {
        .learning-container {
            flex-direction: column;
        }
        .learning-sidebar {
            width: 100%;
            position: relative;
            top: 0;
            max-height: none;
        }
    }

    /* Topic Navigation Menu (GeeksforGeeks Style) */
    .topic-menu {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        overflow: hidden;
    }

    .topic-group {
        border-bottom: 1px solid var(--border-color);
    }
    .topic-group:last-child {
        border-bottom: none;
    }

    .topic-title {
        padding: 1rem 1.25rem;
        margin: 0;
        font-size: 0.95rem;
        font-weight: 700;
        background: var(--bg-panel);
        color: var(--text-primary);
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .topic-links {
        list-style: none;
        padding: 0;
        margin: 0;
        display: none; /* Collapsible */
    }
    
    .topic-group.active .topic-links {
        display: block;
    }

    .topic-links li a {
        display: block;
        padding: 0.75rem 1.25rem 0.75rem 2rem;
        text-decoration: none;
        color: var(--text-secondary);
        font-size: 0.9rem;
        font-weight: 500;
        border-left: 3px solid transparent;
        transition: var(--transition);
    }

    .topic-links li a:hover {
        background: rgba(74, 222, 128, 0.05);
        color: var(--brand-green);
    }

    .topic-links li a.active {
        background: rgba(74, 222, 128, 0.1);
        color: var(--brand-green);
        border-left-color: var(--brand-green);
        font-weight: 700;
    }

    /* Markdown Article Styles */
    .article-body {
        font-size: 1.05rem;
        line-height: 1.8;
        color: var(--text-primary);
    }

    .article-body h1, .article-body h2, .article-body h3 {
        color: var(--text-primary);
        margin-top: 2.5rem;
        margin-bottom: 1rem;
        font-weight: 800;
    }

    .article-body h1 { font-size: 2.2rem; }
    .article-body h2 { font-size: 1.8rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem; }
    .article-body h3 { font-size: 1.4rem; }

    .article-body p {
        margin-bottom: 1.5rem;
        color: var(--text-secondary);
    }

    .article-body ul, .article-body ol {
        margin-bottom: 1.5rem;
        padding-left: 1.5rem;
        color: var(--text-secondary);
    }

    .article-body li {
        margin-bottom: 0.5rem;
    }

    .article-body a {
        color: var(--brand-green);
        text-decoration: none;
        font-weight: 600;
    }
    
    .article-body a:hover {
        text-decoration: underline;
    }

    .article-body pre {
        border-radius: 8px;
        padding: 1.5rem;
        margin-bottom: 1.5rem;
        overflow-x: auto;
        border: 1px solid rgba(255,255,255,0.1);
        box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
    }

    .article-body code {
        font-family: 'Consolas', 'Monaco', monospace;
        font-size: 0.9rem;
    }

    .article-body p code {
        background: var(--bg-panel);
        padding: 0.2rem 0.4rem;
        border-radius: 4px;
        color: var(--brand-orange);
        border: 1px solid var(--border-color);
    }
    
    .article-body blockquote {
        border-left: 4px solid var(--brand-green);
        background: var(--bg-panel);
        padding: 1rem 1.5rem;
        margin-bottom: 1.5rem;
        border-radius: 0 8px 8px 0;
        font-style: italic;
        color: var(--text-secondary);
    }

    .article-body img {
        max-width: 100%;
        height: auto;
        border-radius: 8px;
        margin: 1.5rem 0;
        box-shadow: var(--shadow-md);
    }
    
    .article-body table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 1.5rem;
    }
    
    .article-body th, .article-body td {
        border: 1px solid var(--border-color);
        padding: 0.75rem;
        text-align: left;
    }
    
    .article-body th {
        background: var(--bg-panel);
        font-weight: 700;
    }

</style>
{% endblock %}

{% block content %}
<div class="container animate-fade-in">
    <!-- Common Learning Header -->
    <div class="learning-header">
        <div>
            <h1 class="gradient-text" style="font-size: 2.5rem; margin-bottom: 0.5rem;">Learn & Grow</h1>
            <p style="color: var(--text-secondary); font-size: 1.1rem; max-width: 600px;">
                Master technical concepts, programming languages, and system design with our comprehensive guides.
            </p>
        </div>
        
        <form action="{% url 'learning:learning_search' %}" method="GET" class="learning-search">
            <input type="text" name="q" placeholder="Search tutorials, topics..." value="{{ query|default:'' }}" required>
            <button type="submit" class="btn btn-primary">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                Search
            </button>
        </form>
    </div>

    <!-- Main Content Area to be overridden by child templates -->
    {% block learning_content %}
    {% endblock %}
</div>

<!-- Scripts for sidebar toggles and syntax highlighting -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-java.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-sql.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Toggle topic groups in sidebar
        const topicTitles = document.querySelectorAll('.topic-title');
        topicTitles.forEach(title => {
            title.addEventListener('click', function() {
                const group = this.parentElement;
                group.classList.toggle('active');
                
                // Toggle arrow icon if exists
                const icon = this.querySelector('svg');
                if(icon) {
                    if(group.classList.contains('active')) {
                        icon.style.transform = 'rotate(180deg)';
                    } else {
                        icon.style.transform = 'rotate(0deg)';
                    }
                }
            });
        });
    });
</script>
{% endblock %}
